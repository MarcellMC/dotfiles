# Hyprland Configuration - Optimized for Development Workflow
# This is a comprehensive Hyprland config file for coding, AI agents, and productivity
# Refer to the wiki for more information: https://wiki.hypr.land/Configuring/

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################

# Set programs that you use - customize these as needed
$terminal = kitty
$fileManager = dolphin
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

# Essential processes and your preferred apps at launch
exec-once = [workspace 2 silent] $terminal
exec-once = waybar                    # Status bar
exec-once = mako                      # Notification daemon
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1  # Authentication agent
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

# Workspace apps
exec-once = google-chrome-stable
exec-once = telegram-desktop
exec-once = zoom
exec-once = vivaldi

# Power management - turns off display after 15min, locks screen after 3h (see hypridle.conf)
exec-once = hypridle

# Uncomment if you want network manager applet
# exec-once = nm-applet &


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5                       # Gaps between windows
    gaps_out = 20                     # Gaps between windows and monitor edges

    border_size = 2                   # Window border thickness

    # Window border colors - active window has gradient, inactive is gray
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle                  # Default layout algorithm
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10                     # Rounded corners radius
    rounding_power = 2                # Rounding algorithm power

    # Window transparency settings
    active_opacity = 1.0              # Focused window opacity
    inactive_opacity = 1.0            # Unfocused window opacity

    shadow {
        enabled = true                # Enable window shadows
        range = 4                     # Shadow blur radius
        render_power = 3              # Shadow rendering intensity
        color = rgba(1a1a1aee)        # Shadow color
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true                # Enable background blur
        size = 3                      # Blur radius
        passes = 1                    # Number of blur passes

        vibrancy = 0.1696            # Blur vibrancy
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)          # Enable animations

    # Animation curves - defines easing functions
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Animation definitions - smooth and responsive for productivity
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true             # Maintains split ratios when adding windows
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master               # New windows become master in master layout
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1     # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false    # If true disables the random hyprland logo / anime girl background
    key_press_enables_dpms = true    # Wake monitor on key press after manual dpms off
    mouse_move_enables_dpms = true   # Wake monitor on mouse move after manual dpms off
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us,ru,il               # Keyboard layout
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1                  # Focus follows mouse cursor

    sensitivity = 0                   # Mouse sensitivity: -1.0 to 1.0, 0 means no modification

    touchpad {
        natural_scroll = false        # Disable natural scrolling for touchpad
    }
}

# https://wiki.hypr.land/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false           # Disable touchpad workspace swipe
# }

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

##################
### CORE BINDS ###
##################

# Essential application launches
bind = $mainMod, Return, exec, $terminal        # Open terminal
bind = $mainMod, M, exec, $menu                 # Open application menu
bind = $mainMod, E, exec, $fileManager          # Open file manager
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

bind = $mainMod, Space, exec, hyprctl switchxkblayout all next    # Layout switch
bind = $mainMod SHIFT, R, exec, hyprctl reload  # Reload Hyprland configuration
bind = $mainMod, BackSpace, exec, sleep 0.5 && hyprctl dispatch dpms off    # Super+Backspace to turn off monitor
bind = $mainMod SHIFT, BackSpace, exec, pidof hyprlock || hyprlock          # Super+Shift+Backspace to lock

# Window management
bind = $mainMod, Q, killactive,                 # Close active window
bind = $mainMod SHIFT, Q, exit,                 # Exit Hyprland (safer than Super+Q)
bind = $mainMod, F, togglefloating,             # Toggle floating mode
bind = $mainMod, Escape, fullscreen, 0          # Toggle fullscreen

# Move windows with vim-style keys
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d  
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Preselect direction for a new window
bind = $mainMod ALT, H, layoutmsg, preselect l    # Next window goes left
bind = $mainMod ALT, J, layoutmsg, preselect d    # Next window goes down  
bind = $mainMod ALT, K, layoutmsg, preselect u    # Next window goes up
bind = $mainMod ALT, L, layoutmsg, preselect r    # Next window goes right

# Layout management
bind = $mainMod, P, pseudo,                     # Dwindle pseudotiling
bind = $mainMod, S, layoutmsg, togglesplit      # Dwindle toggle split direction
bind = $mainMod, D, exec, hyprctl keyword general:layout dwindle
bind = $mainMod, T, exec, hyprctl keyword general:layout master

##################
### NAVIGATION ###
##################

# Move focus with arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with vim-style keys (great for coding workflow)
bind = $mainMod, H, movefocus, l                # Focus left
bind = $mainMod, J, movefocus, d                # Focus down
bind = $mainMod, K, movefocus, u                # Focus up
bind = $mainMod, L, movefocus, r                # Focus right

####################
### WINDOW RESIZE ###
####################

# Enter resize mode - then use arrow keys to resize, Escape to exit
bind = $mainMod, R, submap, resize
submap = resize
bind = , right, resizeactive, 10 0              # Grow width
bind = , left, resizeactive, -10 0              # Shrink width
bind = , up, resizeactive, 0 -10                # Shrink height
bind = , down, resizeactive, 0 10               # Grow height
bind = , escape, submap, reset                  # Exit resize mode
submap = reset

####################
### WORKSPACES ###
####################

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad) - great for temporary windows
bind = $mainMod, W, togglespecialworkspace, magic    # Toggle scratchpad visibility
bind = $mainMod SHIFT, W, movetoworkspace, special:magic  # Move window to scratchpad

# Minimize window / restore from special workspace
bind = SUPER, Down, exec, ~/.config/hypr/scripts/minimize.sh
bind = SUPER, Up, togglespecialworkspace, magic


# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1     # Next workspace
bind = $mainMod, mouse_up, workspace, e-1       # Previous workspace

##################
### MOUSE BINDS ###
##################

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow         # Super + Left click to move
bindm = $mainMod, mouse:273, resizewindow       # Super + Right click to resize

##################
### SCREENSHOTS ###
##################

# Screenshot bindings - requires grim and slurp
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy    # Screenshot selection to clipboard
bind = , Print, exec, grim - | wl-copy                          # Screenshot full screen to clipboard
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png  # Screenshot selection to file

#########################
### MULTIMEDIA KEYS ###
#########################

# Volume control (laptop function keys)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control (laptop function keys)
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media player controls - requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

##########################
### WORKSPACE ASSIGNMENTS ###
##########################

windowrule {
    name = ws-chrome
    match:class = ^(google-chrome)$
    workspace = 1 silent
}
windowrule {
    name = ws-telegram
    match:class = ^(org.telegram.desktop)$
    workspace = 3 silent
}
windowrule {
    name = ws-zoom
    match:class = ^(zoom)$
    workspace = 4 silent
}
windowrule {
    name = ws-vivaldi
    match:class = ^(vivaldi-stable)$
    workspace = 5 silent
}

# Ignore maximize requests from apps - prevents apps from going fullscreen unexpectedly
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland applications
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Example window rules for specific applications (uncomment and modify as needed)
# windowrule = float,class:^(kitty)$,title:^(kitty)$                    # Make kitty float
# windowrule = workspace 1,class:^(google-chrome)$                      # Chrome always on workspace 1
# windowrule = workspace 2,class:^(obsidian)$                           # Obsidian always on workspace 2
# windowrule = size 800 600,class:^(floating-app)$                      # Set specific size for app

####################################
### OPTIONAL: SMART GAPS FEATURE ###
####################################

# "Smart gaps" / "No gaps when only one window" - uncomment to enable
# This removes gaps when there's only one window on a workspace
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
