# Hyprlock Configuration
# Migrated from swaylock-effects with GitHub dark theme

# General settings
general {
    hide_cursor = true
    grace = 60
    disable_loading_bar = true
}

# Background with blur effect (similar to swaylock screenshots + blur)
background {
    monitor =
    path = screenshot
    blur_passes = 5
    blur_size = 7
    vibrancy = 0.5
    vibrancy_darkness = 0.5
}

# Input field (password)
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true

    # GitHub dark theme colors
    outer_color = rgb(21262d)
    inner_color = rgb(0d1117)
    font_color = rgb(f0f6fc)
    fade_on_empty = false
    placeholder_text = <span foreground="##7d8590">Enter Password...</span>

    check_color = rgb(3fb950)
    fail_color = rgb(f85149)

    position = 0, -200
    halign = center
    valign = center
}

# Clock - Time display
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgb(f0f6fc)
    font_size = 72
    font_family = JetBrains Mono

    position = 0, 150
    halign = center
    valign = center
}

# Clock - Date display
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%a, %B %e')"
    color = rgb(7d8590)
    font_size = 24
    font_family = JetBrains Mono

    position = 0, 75
    halign = center
    valign = center
}

# Keyboard layout display
label {
    monitor =
    text = cmd[update:1000] hyprctl devices -j | jq -r '.keyboards[] | select(.main) | .active_keymap' | head -n1
    color = rgb(7d8590)
    font_size = 16
    font_family = JetBrains Mono

    position = 0, -300
    halign = center
    valign = center
}

# Failed attempts counter
label {
    monitor =
    text = cmd[update:1000] echo "$ATTEMPTS"
    color = rgb(f85149)
    font_size = 16
    font_family = JetBrains Mono

    position = 0, -350
    halign = center
    valign = center
}
